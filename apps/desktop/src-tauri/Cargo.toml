[package]
name = "captun-desktop"
description = "Captun desktop GUI (Tauri shell around the service IPC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "captun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
captun-core.workspace = true
captun-ipc.workspace = true
# Only for what needs no privileges: listing network adapters and asking
# whether Wi-Fi can host a hotspot, so both work before the service runs.
captun-platform.workspace = true
httparse.workspace = true
# Seals the settings on macOS and Linux (Windows uses DPAPI); already built for rustls.
ring = "0.17"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
