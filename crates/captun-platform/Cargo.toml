[package]
name = "captun-platform"
description = "OS integration: hotspot backends and network interface discovery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
ipnet.workspace = true
netdev = "0.36"
captun-core.workspace = true
captun-dhcp.workspace = true
captun-outbound.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tun = { version = "0.8", default-features = false, features = ["async"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Radios",
    "Devices_WiFi",
    "Foundation",
    "Foundation_Collections",
    "Networking",
    "Networking_Connectivity",
    "Networking_NetworkOperators",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }
libloading = "0.9"
zeroize.workspace = true

[lints]
workspace = true
