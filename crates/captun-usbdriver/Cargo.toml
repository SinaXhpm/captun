[package]
name = "captun-usbdriver"
description = "Captun's USB driver for Android phones on Windows: Windows' own WinUSB for every phone's USB debugging interface, signed on this computer with a one-off certificate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Catalog making and signing (wintrust, mssign32, CNG), the certificate
# stores, the driver store and devices (SetupAPI, newdev, cfgmgr32), and the
# registry record of what was installed.
windows-sys = { workspace = true, features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[lints]
workspace = true
