captun-adb.workspace = true
captun-core.workspace = true
captun-dhcp.workspace = true
captun-dns.workspace = true
captun-engine.workspace = true
captun-ipc.workspace = true
captun-outbound.workspace = true
captun-platform.workspace = true
captun-policy.workspace = true
captun-usbdriver.workspace = true
captun-xray.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
