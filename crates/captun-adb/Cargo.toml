[package]
name = "captun-adb"
description = "Android Debug Bridge control: USB-tethering uplink and no-app reverse tethering, built as testable command plans"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
adb_client.workspace = true
rsa.workspace = true
rusb.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Reading and setting who may use the phone key and its folder, on the
# handles that hold them open.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
